<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LaunchPad Academy</title>
<style>
  :root{
    --primary:#0b1e3a;   /* navy from the logo */
    --secondary:#d4af37; /* gold from the logo */
    --accent:#c0c4cc;    /* silver */
    --bg:#f7f9fc;
    --surface:#ffffff;
    --text:#1f2933;
    --border:#e2e8f0;
    --danger:#d64545;
    --success:#2e8b57;
    --radius:10px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text)}
  [dir="rtl"] body{font-family:"Segoe UI",Tahoma,"Cairo",Arial,sans-serif}
  a{color:inherit}
  .app-shell{display:flex;min-height:100vh}
  .sidebar{width:220px;background:var(--primary);color:#fff;padding:20px 0;flex-shrink:0}
  .sidebar .logo-area{display:flex;align-items:center;gap:10px;padding:0 20px 20px}
  .sidebar .logo-area img{width:36px;height:36px;border-radius:6px;background:#fff;object-fit:cover}
  .sidebar a{display:block;padding:12px 20px;color:#fff;text-decoration:none;opacity:.85;cursor:pointer}
  .sidebar a:hover,.sidebar a.active{opacity:1;background:rgba(255,255,255,.12)}
  .main-content{flex:1;padding:24px;max-width:1000px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
  .btn{background:var(--primary);color:#fff;border:none;padding:9px 16px;border-radius:6px;cursor:pointer;font-size:14px;display:inline-block;text-decoration:none}
  .btn.secondary{background:var(--secondary);color:#222}
  .btn.danger{background:var(--danger);color:#fff}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;margin-bottom:12px;font-size:14px;font-family:inherit}
  label{font-size:13px;font-weight:600;display:block;margin-bottom:4px}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border)}
  [dir="rtl"] th,[dir="rtl"] td{text-align:right}
  .badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;background:#eee}
  .badge.live{background:#ffe4c4;color:#a5590a}
  .badge.recorded{background:#d7ecff;color:#0b1e3a}
  .login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--primary)}
  .login-box{background:#fff;padding:32px;border-radius:var(--radius);width:340px;text-align:center}
  .login-box img{width:72px;margin-bottom:12px;border-radius:8px}
  .login-box .demo-creds{font-size:12px;color:#888;text-align:left;margin-top:10px;line-height:1.5}
  .error-text{color:var(--danger)}
  .row{display:flex;gap:8px;align-items:flex-end}
  .row > *{flex:1}
  .muted{color:#888;font-size:13px}
</style>
</head>
<body>
<div id="app"></div>

// =========================================================================
// LOCAL "BACKEND" — everything the app needs, backed by localStorage
// =========================================================================
const DB_KEY = "academyDB_v1";
const SESSION_KEY = "academySession_v1";

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

function seedDB() {
  const now = new Date().toISOString();
  const admin = { id: uid(), idNumber: "ADMIN001", password: "admin123", name: "Academy Admin", role: "admin", phone: "", email: "" };
  const teacher = { id: uid(), idNumber: "TCH001", password: "teacher123", name: "Sample Teacher", role: "teacher", phone: "", email: "" };
  const student = { id: uid(), idNumber: "STU001", password: "student123", name: "Sample Student", role: "student", phone: "", email: "" };
  const cls = {
    id: uid(), name: "Intro to Robotics", gradeLevel: "Grade 8", courseType: "live",
    zoomLink: "https://zoom.us/j/000000000", zoomSchedule: "Mon/Wed 6:00 PM",
    driveFolderLink: "", lessons: [], students: [student.id], passingGrade: 60
  };
  return {
    users: [admin, teacher, student],
    classes: [cls],
    assignments: [],
    submissions: [],
    grades: [],
    certificates: [],
    announcements: [
      { id: uid(), title: "Welcome to LaunchPad Academy", message: "This portal is now running fully offline in your browser.", createdAt: now }
    ],
    integrations: { google: { connected: false, email: "" }, zoom: { connected: false, email: "" } }
  };
}

function loadDB() {
  let raw = localStorage.getItem(DB_KEY);
  if (!raw) {
    const fresh = seedDB();
    localStorage.setItem(DB_KEY, JSON.stringify(fresh));
    return fresh;
  }
  try { return JSON.parse(raw); } catch { const fresh = seedDB(); localStorage.setItem(DB_KEY, JSON.stringify(fresh)); return fresh; }
}
function saveDB(db) { localStorage.setItem(DB_KEY, JSON.stringify(db)); }

function safeUser(u) { return { id: u.id, idNumber: u.idNumber, name: u.name, role: u.role, phone: u.phone, email: u.email }; }

function gradeTotals(items) {
  const totalScore = (items || []).reduce((s, i) => s + Number(i.score || 0), 0);
  const totalMax = (items || []).reduce((s, i) => s + Number(i.maxScore || 0), 0);
  const percentage = totalMax > 0 ? Math.round((totalScore / totalMax) * 10000) / 100 : 0;
  return { totalScore, totalMax, percentage };
}

function classView(c) {
  return { ...c, _id: c.id, students: c.students.map((sid) => {
    const u = loadDB().users.find((x) => x.id === sid);
    return u ? { _id: u.id, idNumber: u.idNumber, name: u.name } : null;
  }).filter(Boolean) };
}

// Mimics the old fetch-based api(path, opts) but resolves entirely locally.
async function api(path, { method = "GET", body } = {}) {
  await new Promise((r) => setTimeout(r, 40)); // tiny delay so loading states are visible
  const db = loadDB();
  const session = JSON.parse(localStorage.getItem(SESSION_KEY) || "null");
  const me = session ? db.users.find((u) => u.id === session.userId) : null;
  const fail = (message) => { const e = new Error(message); throw e; };
  const seg = path.split("?")[0].split("/").filter(Boolean); // e.g. ["classes", "abc123"]

  // ---- auth ----
  if (path === "/auth/login" && method === "POST") {
    const u = db.users.find((x) => x.idNumber === body.idNumber && x.password === body.password);
    if (!u) fail("Invalid ID number or password");
    localStorage.setItem(SESSION_KEY, JSON.stringify({ userId: u.id }));
    return { token: "local-" + u.id, user: safeUser(u) };
  }
  if (!me) fail("Session expired");

  // ---- classes ----
  if (seg[0] === "classes" && seg.length === 1 && method === "GET") {
    let list = db.classes;
    if (me.role === "student") list = list.filter((c) => c.students.includes(me.id));
    return list.map(classView);
  }
  if (seg[0] === "classes" && seg.length === 1 && method === "POST") {
    if (me.role !== "admin") fail("Only admins can create classes");
    const c = {
      id: uid(), name: body.name, gradeLevel: body.gradeLevel, courseType: body.courseType,
      zoomLink: body.zoomLink || "", zoomSchedule: body.zoomSchedule || "",
      driveFolderLink: body.driveFolderLink || "", lessons: [], students: [],
      passingGrade: body.passingGrade || 60
    };
    (body.studentIds || []).forEach((idNumber) => {
      const s = db.users.find((u) => u.idNumber === idNumber && u.role === "student");
      if (s) c.students.push(s.id);
    });
    db.classes.push(c); saveDB(db);
    return classView(c);
  }
  if (seg[0] === "classes" && seg.length === 2 && method === "GET") {
    const c = db.classes.find((x) => x.id === seg[1]); if (!c) fail("Class not found");
    return classView(c);
  }
  if (seg[0] === "classes" && seg[2] === "students" && seg.length === 3 && method === "POST") {
    const c = db.classes.find((x) => x.id === seg[1]); if (!c) fail("Class not found");
    const s = db.users.find((u) => u.idNumber === body.idNumber && u.role === "student");
    if (!s) fail("No student with that ID number");
    if (!c.students.includes(s.id)) c.students.push(s.id);
    saveDB(db); return classView(c);
  }
  if (seg[0] === "classes" && seg[2] === "students" && seg.length === 4 && method === "DELETE") {
    const c = db.classes.find((x) => x.id === seg[1]); if (!c) fail("Class not found");
    c.students = c.students.filter((sid) => sid !== seg[3]);
    saveDB(db); return { ok: true };
  }
  if (seg[0] === "classes" && seg[2] === "lessons" && seg.length === 3 && method === "POST") {
    const c = db.classes.find((x) => x.id === seg[1]); if (!c) fail("Class not found");
    c.lessons.push({ _id: uid(), title: body.title, videoUrl: body.videoUrl, order: c.lessons.length });
    saveDB(db); return classView(c);
  }
  if (seg[0] === "classes" && seg[2] === "lessons" && seg.length === 4 && method === "DELETE") {
    const c = db.classes.find((x) => x.id === seg[1]); if (!c) fail("Class not found");
    c.lessons = c.lessons.filter((l) => l._id !== seg[3]);
    saveDB(db); return { ok: true };
  }

  // ---- assignments ----
  if (seg[0] === "assignments" && seg[1] === "class" && method === "GET") {
    return db.assignments.filter((a) => a.classId === seg[2]).map((a) => ({ ...a, _id: a.id }));
  }
  if (seg[0] === "assignments" && seg.length === 1 && method === "POST") {
    const a = { id: uid(), classId: body.classId, title: body.title, dueDate: body.dueDate };
    db.assignments.push(a); saveDB(db); return { ...a, _id: a.id };
  }
  if (seg[0] === "assignments" && seg[2] === "mine" && method === "GET") {
    const sub = db.submissions.find((s) => s.assignmentId === seg[1] && s.studentId === me.id);
    return sub || null;
  }
  if (seg[0] === "assignments" && seg[2] === "submit" && method === "POST") {
    let sub = db.submissions.find((s) => s.assignmentId === seg[1] && s.studentId === me.id);
    if (sub) { sub.textAnswer = body.textAnswer; sub.submittedAt = new Date().toISOString(); }
    else { sub = { id: uid(), assignmentId: seg[1], studentId: me.id, textAnswer: body.textAnswer, submittedAt: new Date().toISOString() }; db.submissions.push(sub); }
    saveDB(db); return sub;
  }
  if (seg[0] === "assignments" && seg[2] === "submissions" && method === "GET") {
    return db.submissions.filter((s) => s.assignmentId === seg[1]).map((s) => {
      const stu = db.users.find((u) => u.id === s.studentId);
      return { ...s, studentName: stu ? stu.name : "Unknown" };
    });
  }

  // ---- grades ----
  if (seg[0] === "grades" && seg[1] === "class" && method === "GET") {
    const c = db.classes.find((x) => x.id === seg[2]);
    return (c ? c.students : []).map((sid) => {
      const stu = db.users.find((u) => u.id === sid);
      const g = db.grades.find((x) => x.classId === seg[2] && x.studentId === sid);
      return { student: { _id: sid, name: stu ? stu.name : "Unknown" }, items: g ? g.items : [], totals: gradeTotals(g ? g.items : []) };
    });
  }
  if (seg[0] === "grades" && seg[1] === "mine" && method === "GET") {
    const g = db.grades.find((x) => x.classId === seg[2] && x.studentId === me.id);
    return { items: g ? g.items : [], totals: gradeTotals(g ? g.items : []) };
  }
  if (seg[0] === "grades" && seg.length === 3 && method === "PUT") {
    let g = db.grades.find((x) => x.classId === seg[1] && x.studentId === seg[2]);
    if (!g) { g = { id: uid(), classId: seg[1], studentId: seg[2], items: [] }; db.grades.push(g); }
    g.items = body.items || [];
    saveDB(db); return { items: g.items, totals: gradeTotals(g.items) };
  }

  // ---- certificates ----
  if (path === "/certificates/issue" && method === "POST") {
    const g = db.grades.find((x) => x.classId === body.classId && x.studentId === body.studentId);
    const totals = gradeTotals(g ? g.items : []);
    const c = db.classes.find((x) => x.id === body.classId);
    if (totals.percentage < (c ? c.passingGrade : 60)) fail(`Student has not met the passing grade (${c ? c.passingGrade : 60}%)`);
    db.certificates.push({ id: uid(), classId: body.classId, studentId: body.studentId, issuedAt: new Date().toISOString() });
    saveDB(db); return { ok: true };
  }

  // ---- users (admin) ----
  if (seg[0] === "users" && seg.length === 1 && method === "GET") {
    if (me.role !== "admin") fail("Admins only");
    const role = new URLSearchParams(path.split("?")[1] || "").get("role");
    return db.users.filter((u) => !role || u.role === role).map(safeUser);
  }
  if (seg[0] === "users" && seg.length === 1 && method === "POST") {
    if (me.role !== "admin") fail("Admins only");
    if (db.users.some((u) => u.idNumber === body.idNumber)) fail("That ID number is already in use");
    const u = { id: uid(), idNumber: body.idNumber, name: body.name, role: body.role, phone: body.phone || "", email: body.email || "", password: body.password };
    db.users.push(u); saveDB(db); return safeUser(u);
  }
  if (seg[0] === "users" && seg.length === 2 && method === "PUT") {
    if (me.role !== "admin") fail("Admins only");
    const u = db.users.find((x) => x.id === seg[1]); if (!u) fail("User not found");
    u.name = body.name; u.role = body.role; u.phone = body.phone || ""; u.email = body.email || "";
    if (body.password) u.password = body.password;
    saveDB(db); return safeUser(u);
  }
  if (seg[0] === "users" && seg.length === 2 && method === "DELETE") {
    if (me.role !== "admin") fail("Admins only");
    db.users = db.users.filter((x) => x.id !== seg[1]); saveDB(db); return { ok: true };
  }

  // ---- integrations (mocked — no real OAuth without a server) ----
  if (path === "/integrations/status" && method === "GET") return db.integrations;
  if (path === "/integrations/google/connect" && method === "POST") {
    db.integrations.google = { connected: true, email: me.email || (me.idNumber + "@launchpad.academy") };
    saveDB(db); return { url: "#/admin/integrations" };
  }
  if (path === "/integrations/google" && method === "DELETE") {
    db.integrations.google = { connected: false, email: "" }; saveDB(db); return { ok: true };
  }
  if (path === "/integrations/zoom/connect" && method === "POST") {
    db.integrations.zoom = { connected: true, email: body.accountId }; saveDB(db); return { ok: true };
  }
  if (path === "/integrations/zoom" && method === "DELETE") {
    db.integrations.zoom = { connected: false, email: "" }; saveDB(db); return { ok: true };
  }

  // ---- announcements ----
  if (path === "/announcements" && method === "GET") {
    return [...db.announcements].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
  }
  if (path === "/announcements" && method === "POST") {
    if (me.role !== "admin") fail("Admins only");
    db.announcements.push({ id: uid(), title: body.title, message: body.message, createdAt: new Date().toISOString() });
    saveDB(db); return { ok: true };
  }
  if (seg[0] === "announcements" && seg.length === 2 && method === "DELETE") {
    db.announcements = db.announcements.filter((a) => a.id !== seg[1]); saveDB(db); return { ok: true };
  }

  fail("Unknown request: " + method + " " + path);
}

// ---- Tiny state helpers ----
const getUser = () => {
  const session = JSON.parse(localStorage.getItem(SESSION_KEY) || "null");
  if (!session) return null;
  const u = loadDB().users.find((x) => x.id === session.userId);
  return u ? safeUser(u) : null;
};
const clearSession = () => localStorage.removeItem(SESSION_KEY);

// ---- Tiny hash router --------------------------------------------------
const routes = {};
function route(pattern, handler) { routes[pattern] = handler; }

function matchRoute(hash) {
  const path = hash.replace(/^#/, "") || "/login";
  for (const pattern in routes) {
    const paramNames = [];
    const regexStr = "^" + pattern.replace(/:[^/]+/g, (m) => {
      paramNames.push(m.slice(1));
      return "([^/]+)";
    }) + "$";
    const match = path.match(new RegExp(regexStr));
    if (match) {
      const params = {};
      paramNames.forEach((name, i) => (params[name] = match[i + 1]));
      return { handler: routes[pattern], params };
    }
  }
  return null;
}

async function render() {
  const app = document.getElementById("app");
  const user = getUser();
  const hash = location.hash || "#/login";

  if (!user && hash !== "#/login") { location.hash = "#/login"; return; }
  if (user && hash === "#/login") { location.hash = "#/"; return; }

  const matched = matchRoute(hash);
  if (!matched) { app.innerHTML = "<p>Page not found</p>"; return; }

  if (hash === "#/login") {
    app.innerHTML = "";
    app.appendChild(await matched.handler(matched.params));
    return;
  }

  // Authenticated layout: sidebar + content
  app.innerHTML = "";
  const shell = document.createElement("div");
  shell.className = "app-shell";
  shell.appendChild(renderSidebar(hash));
  const main = document.createElement("div");
  main.className = "main-content";
  main.innerHTML = "<p>Loading...</p>";
  shell.appendChild(main);
  app.appendChild(shell);

  try {
    const content = await matched.handler(matched.params);
    main.innerHTML = "";
    main.appendChild(content);
  } catch (err) {
    main.innerHTML = `<p class="error-text">${err.message}</p>`;
  }
}

window.addEventListener("hashchange", render);
window.addEventListener("DOMContentLoaded", render);

    form.reset();
    form.editingId.value = "";
    form.idNumber.disabled = false;
    form.password.required = true;
    el.querySelector("#passwordLabel").textContent = "Password";
    el.querySelector("#userFormTitle").textContent = "Add User";
    el.querySelector("#userSubmitBtn").textContent = "Create User";
    el.querySelector("#cancelEditBtn").style.display = "none";
  }

  el.querySelector("#cancelEditBtn").onclick = resetForm;
  roleFilter.onchange = loadUsers;

  form.onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(form);
    const editingId = fd.get("editingId");
    const body = {
      idNumber: fd.get("idNumber"),
      name: fd.get("name"),
      role: fd.get("role"),
      phone: fd.get("phone"),
      email: fd.get("email")
    };
    if (fd.get("password")) body.password = fd.get("password");

    try {
      if (editingId) {
        await api(`/users/${editingId}`, { method: "PUT", body });
      } else {
        body.password = fd.get("password");
        await api("/users", { method: "POST", body });
      }
      resetForm();
      loadUsers();
    } catch (err) {
      alert(err.message);
    }
  };

  await loadUsers();
  return el;
});

// ADMIN: INTEGRATIONS (Google Drive + Zoom) — mocked, local only
// =========================================================================
route("/admin/integrations", async () => {
  const status = await api("/integrations/status");
  const el = h(`
    <div>
      <h2>Integrations</h2>
      <p class="muted">This is a fully offline build, so these connections are simulated locally rather than talking to real Google/Zoom accounts.</p>
      <div class="card" style="max-width:480px">
        <h3>Google Drive</h3>
        <div id="googleStatus"></div>
      </div>
      <div class="card" style="max-width:480px">
        <h3>Zoom</h3>
        <div id="zoomStatus"></div>
      </div>
    </div>
  `);

  const googleStatus = el.querySelector("#googleStatus");
  if (status.google.connected) {
    googleStatus.innerHTML = `<p>Connected as <strong>${escapeHtml(status.google.email)}</strong></p><button class="btn danger" id="disconnectGoogle">Disconnect</button>`;
    googleStatus.querySelector("#disconnectGoogle").onclick = async () => {
      await api("/integrations/google", { method: "DELETE" });
      render();
    };
  } else {
    googleStatus.innerHTML = `
      <p>Simulate signing in with the academy's Google account to attach Drive files/folders to classes.</p>
      <button class="btn" id="connectGoogle">Connect Google Drive</button>
    `;
    googleStatus.querySelector("#connectGoogle").onclick = async () => {
      await api("/integrations/google/connect", { method: "POST" });
      render();
    };
  }

  const zoomStatus = el.querySelector("#zoomStatus");
  if (status.zoom.connected) {
    zoomStatus.innerHTML = `<p>Connected as <strong>${escapeHtml(status.zoom.email)}</strong></p><button class="btn danger" id="disconnectZoom">Disconnect</button>`;
    zoomStatus.querySelector("#disconnectZoom").onclick = async () => {
      await api("/integrations/zoom", { method: "DELETE" });
      render();
    };
  } else {
    zoomStatus.innerHTML = `
      <p class="muted">Enter any Server-to-Server OAuth credentials to simulate a Zoom connection.</p>
      <form id="zoomForm">
        <label>Account ID</label>
        <input name="accountId" required />
        <label>Client ID</label>
        <input name="clientId" required />
        <label>Client Secret</label>
        <input name="clientSecret" type="password" required />
        <button class="btn">Connect Zoom</button>
      </form>
      <p id="zoomMessage" class="error-text"></p>
    `;
    zoomStatus.querySelector("#zoomForm").onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      try {
        await api("/integrations/zoom/connect", {
          method: "POST",
          body: { accountId: fd.get("accountId"), clientId: fd.get("clientId"), clientSecret: fd.get("clientSecret") }
        });
        render();
      } catch (err) {
        zoomStatus.querySelector("#zoomMessage").textContent = err.message;
      }
    };
  }

  return el;
});

// =========================================================================
// ANNOUNCEMENTS  (never shows who posted them)
// =========================================================================
route("/announcements", async () => {
  const user = getUser();
  const list = await api("/announcements");

  const el = h(`
    <div>
      <h2>Announcements</h2>
      ${user.role === "admin" ? `
        <form id="announceForm" class="card" style="max-width:480px">
          <label>Title</label>
          <input name="title" required />
          <label>Message</label>
          <textarea name="message" rows="3" required></textarea>
          <button class="btn">Post Announcement</button>
        </form>` : ""}
      <div id="announceList"></div>
    </div>
  `);

  const announceList = el.querySelector("#announceList");
  list.forEach((a) => {
    // Note: by design, no author/poster name is ever shown here.
    const card = h(`
      <div class="card">
        <h3>${escapeHtml(a.title)}</h3>
        <p>${escapeHtml(a.message)}</p>
        <small>${new Date(a.createdAt).toLocaleString()}</small>
        ${user.role === "admin" ? `<div><button class="btn danger" data-delete="${a.id}">Delete</button></div>` : ""}
      </div>
    `);
    announceList.appendChild(card);
  });
  announceList.querySelectorAll("[data-delete]").forEach((btn) => {
    btn.onclick = async () => {
      await api(`/announcements/${btn.dataset.delete}`, { method: "DELETE" });
      render();
    };
  });

  const form = el.querySelector("#announceForm");
  if (form) {
    form.onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      await api("/announcements", { method: "POST", body: { title: fd.get("title"), message: fd.get("message") } });
      render();
    };
  }

  return el;
});

// ---- utils ----
function escapeHtml(str) {
  if (str === undefined || str === null) return "";
  return String(str)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
